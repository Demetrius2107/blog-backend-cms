server:
  port: 8080

spring:
  application:
    name: vellastra-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      routes:
        - id: vellastra-auth
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: vellastra-user
          uri: http://localhost:8082
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: vellastra-article
          uri: http://localhost:8083
          predicates:
            - Path=/api/article/**
          filters:
            - StripPrefix=2
        - id: vellastra-category
          uri: http://localhost:8084
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=2
        - id: vellastra-comment
          uri: http://localhost:8085
          predicates:
            - Path=/api/comment/**
          filters:
            - StripPrefix=2
        - id: vellastra-file
          uri: http://localhost:8086
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1
        - id: vellastra-publish
          uri: http://localhost:8088
          predicates:
            - Path=/api/publish/**
          filters:
            - StripPrefix=2

logging:
  level:
    com.demetrius.vellastra.gateway: debug

gateway:
  white-list: /auth/login,/auth/register,/actuator/**,/doc.html,/v3/api-docs,/swagger-ui/**,/webjars/**,/api/article/export/**

# Sentinel 限流配置
spring.cloud.sentinel:
  transport.dashboard: localhost:8858
  eager: true
  datasource.ds.file:
    file:
      file: classpath:sentinel-flow.json
      data-type: json
      rule-type: flow
